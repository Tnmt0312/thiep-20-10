<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10 - Bó Hoa Tươi Thắm</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Be Vietnam Pro + Mali) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Mali:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .font-cursive {
            font-family: 'Mali', 'Be Vietnam Pro', cursive;
        }
        .bg-glow {
            background: radial-gradient(circle at 50% 40%, rgba(255, 182, 193, 0.35) 0%, rgba(255, 240, 243, 0.15) 50%, rgba(255, 255, 255, 0) 75%);
        }
        #petalCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(225, 112, 137, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        .bouquet-container {
            position: relative;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bouquet-container:hover {
            transform: scale(1.03) translateY(-6px);
        }
        @keyframes subtleSwayLeft { 0%, 100% { transform: rotate(-22deg) scale(0.92); } 50% { transform: rotate(-25deg) scale(0.92) translateY(-4px); } }
        @keyframes subtleSwayRight { 0%, 100% { transform: rotate(22deg) scale(0.92); } 50% { transform: rotate(25deg) scale(0.92) translateY(-4px); } }
        @keyframes subtleSwayCenter { 0%, 100% { transform: rotate(0deg) scale(1.05); } 50% { transform: rotate(-2deg) scale(1.05) translateY(-6px); } }
        @keyframes subtleSwayFarLeft { 0%, 100% { transform: rotate(-42deg) scale(0.8); } 50% { transform: rotate(-39deg) scale(0.8); } }
        @keyframes subtleSwayFarRight { 0%, 100% { transform: rotate(42deg) scale(0.8); } 50% { transform: rotate(39deg) scale(0.8); } }

        .stem-center { animation: subtleSwayCenter 6s ease-in-out infinite; transform-origin: bottom center; }
        .stem-left { animation: subtleSwayLeft 5.5s ease-in-out infinite; transform-origin: bottom center; }
        .stem-right { animation: subtleSwayRight 5.8s ease-in-out infinite; transform-origin: bottom center; }
        .stem-far-left { animation: subtleSwayFarLeft 6.2s ease-in-out infinite; transform-origin: bottom center; }
        .stem-far-right { animation: subtleSwayFarRight 6.5s ease-in-out infinite; transform-origin: bottom center; }

        .vinyl-disk { transition: transform 0.5s ease; }
        .spinning { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .card-modal { transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .card-modal.hidden-modal { opacity: 0; transform: scale(0.9) translateY(20px); pointer-events: none; }
        .card-modal.visible-modal { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }

        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.4); } 50% { box-shadow: 0 0 0 16px rgba(244, 114, 182, 0); } }
        .pulse-hint { animation: pulseGlow 2s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 relative bg-slate-50 text-slate-800">

    <canvas id="petalCanvas"></canvas>
    <div class="fixed inset-0 bg-glow pointer-events-none z-0"></div>

    <!-- Header -->
    <header class="w-full max-w-md z-10 flex justify-between items-center pt-2 px-2">
        <div class="flex items-center gap-2">
            <span class="inline-block w-3 h-3 rounded-full bg-pink-500 animate-ping"></span>
            <span class="text-xs font-semibold text-pink-600 uppercase">20 Tháng 10</span>
        </div>

        <div id="musicToggle" class="flex items-center gap-3 bg-white/80 backdrop-blur-md px-3 py-1.5 rounded-full shadow-sm border border-pink-100 cursor-pointer hover:bg-white transition-all">
            <div class="relative w-7 h-7 flex items-center justify-center">
                <div id="vinylRecord" class="w-7 h-7 rounded-full bg-slate-900 flex items-center justify-center vinyl-disk shadow-sm">
                    <div class="w-2.5 h-2.5 rounded-full bg-pink-400 border border-slate-900"></div>
                </div>
            </div>
            <div class="text-xs pr-1">
                <p id="musicStatus" class="font-medium text-slate-700 leading-tight">Nhạc Nền</p>
                <p class="text-[10px] text-slate-400">Chạm để phát</p>
            </div>
            <i id="musicIcon" class="fa-solid fa-music text-xs text-pink-500"></i>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center my-4 z-10 relative">
        <div class="text-center mb-2">
            <h1 class="text-3xl sm:text-4xl font-cursive font-bold text-slate-800 leading-snug">
                Chúc Mừng Ngày <span class="text-pink-600">20/10</span>
            </h1>
            <p class="text-xs text-slate-500 mt-1">Dành tặng người phụ nữ tuyệt vời nhất</p>
        </div>

        <!-- FULL VECTOR FLOWER BRANCH DEFINITION -->
        <svg class="hidden">
            <defs>
                <g id="botanicalFlowerBranch">
                    <!-- Stems & Branches -->
                    <path d="M 100 280 C 95 210, 105 140, 110 80" stroke="#4d6238" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                    <path d="M 100 200 C 120 180, 140 170, 155 160" stroke="#4d6238" stroke-width="2.8" fill="none" stroke-linecap="round"/>
                    <path d="M 102 150 C 80 130, 65 110, 60 95" stroke="#4d6238" stroke-width="2.5" fill="none" stroke-linecap="round"/>

                    <!-- Green Leaves -->
                    <path d="M 100 210 Q 60 190, 45 220 Q 75 235, 100 210 Z" fill="#88a760" stroke="#2c3a1e" stroke-width="1.2"/>
                    <path d="M 100 210 Q 72 215, 45 220" stroke="#2c3a1e" stroke-width="0.8" fill="none"/>
                    <path d="M 105 170 Q 140 145, 160 175 Q 125 185, 105 170 Z" fill="#9abb6e" stroke="#2c3a1e" stroke-width="1.2"/>
                    <path d="M 105 170 Q 132 162, 160 175" stroke="#2c3a1e" stroke-width="0.8" fill="none"/>
                    <path d="M 110 95 Q 135 70, 145 90 Q 125 105, 110 95 Z" fill="#7fa054" stroke="#2c3a1e" stroke-width="1"/>

                    <!-- FLOWER 1: Large Pink Lily (Bottom/Center) -->
                    <g transform="translate(100, 190)">
                        <path d="M 0 0 C -45 15, -65 40, -45 65 C -20 60, -5 30, 0 0 Z" fill="#eb788a" stroke="#2b181c" stroke-width="1.2"/>
                        <path d="M 0 0 C 15 45, 40 65, 65 45 C 60 20, 30 5, 0 0 Z" fill="#e86b7f" stroke="#2b181c" stroke-width="1.2"/>
                        <path d="M 0 0 C -35 -25, -60 -20, -55 10 C -35 20, -15 10, 0 0 Z" fill="#f18a9b" stroke="#2b181c" stroke-width="1.2"/>
                        <path d="M 0 0 C -20 30, -10 70, 10 75 C 25 50, 15 20, 0 0 Z" fill="#f396a6" stroke="#2b181c" stroke-width="1.2"/>
                        <path d="M 0 0 C 35 -10, 60 -35, 40 -50 C 20 -40, 10 -15, 0 0 Z" fill="#ee7e91" stroke="#2b181c" stroke-width="1.2"/>
                        <path d="M 0 0 C -10 -40, -40 -50, -50 -30 C -35 -10, -15 -5, 0 0 Z" fill="#ea7084" stroke="#2b181c" stroke-width="1.2"/>
                        <path d="M 0 0 C -8 20, -4 45, 5 55" stroke="#a33246" stroke-width="0.8" fill="none"/>
                        <path d="M 0 0 C 15 -5, 30 -20, 25 -32" stroke="#a33246" stroke-width="0.8" fill="none"/>
                        <path d="M -10 15 C -25 22, -35 35, -30 48" stroke="#a33246" stroke-width="0.6" fill="none"/>
                        <path d="M 0 0 C 5 -15, 12 -25, 10 -35" stroke="#331017" stroke-width="1.2" fill="none"/>
                        <circle cx="10" cy="-35" r="2.5" fill="#581622"/>
                        <path d="M 0 0 C -2 -15, -2 -28, -8 -38" stroke="#331017" stroke-width="1.2" fill="none"/>
                        <circle cx="-8" cy="-38" r="2.5" fill="#581622"/>
                        <path d="M 0 0 C 10 -8, 22 -12, 28 -18" stroke="#331017" stroke-width="1.2" fill="none"/>
                        <circle cx="28" cy="-18" r="2.5" fill="#581622"/>
                    </g>

                    <!-- FLOWER 2: Top Peony Bloom -->
                    <g transform="translate(110, 80)">
                        <path d="M 0 0 C 20 -25, 45 -20, 35 5 C 15 15, 5 5, 0 0 Z" fill="#f08395" stroke="#2b181c" stroke-width="1.1"/>
                        <path d="M 0 0 C -20 -30, -45 -15, -35 10 C -15 15, -5 5, 0 0 Z" fill="#e5697e" stroke="#2b181c" stroke-width="1.1"/>
                        <path d="M 0 0 C -15 -40, 10 -45, 15 -25 C 8 -12, 3 -5, 0 0 Z" fill="#f49aa8" stroke="#2b181c" stroke-width="1.1"/>
                        <path d="M 0 0 C 30 10, 40 30, 20 35 C 5 25, 2 10, 0 0 Z" fill="#e77286" stroke="#2b181c" stroke-width="1.1"/>
                        <path d="M 0 0 C -25 15, -35 35, -15 35 C -2 22, -1 10, 0 0 Z" fill="#f28e9f" stroke="#2b181c" stroke-width="1.1"/>
                        <path d="M 0 0 C -8 -15, 5 -20, 8 -10 Z" fill="#f8b6c1" stroke="#2b181c" stroke-width="0.9"/>
                        <path d="M 0 0 C -10 -20, -20 -10, -25 2" stroke="#9e283c" stroke-width="0.7" fill="none"/>
                        <path d="M 0 0 C 10 -15, 22 -10, 20 2" stroke="#9e283c" stroke-width="0.7" fill="none"/>
                    </g>

                    <!-- FLOWER 3: Side Peony Bloom (Right) -->
                    <g transform="translate(155, 160)">
                        <path d="M 0 0 C 25 -15, 45 -5, 35 20 C 15 20, 5 8, 0 0 Z" fill="#f28fa0" stroke="#2b181c" stroke-width="1.1"/>
                        <path d="M 0 0 C 15 25, 25 45, -2 35 C -5 20, -2 8, 0 0 Z" fill="#e25c73" stroke="#2b181c" stroke-width="1.1"/>
                        <path d="M 0 0 C 30 5, 45 25, 25 35 C 10 25, 2 12, 0 0 Z" fill="#ea778b" stroke="#2b181c" stroke-width="1.1"/>
                        <path d="M 0 0 C -10 -25, 15 -30, 20 -10 C 10 -5, 3 -2, 0 0 Z" fill="#f5a3b1" stroke="#2b181c" stroke-width="1.1"/>
                        <path d="M 5 5 C 18 2, 28 12, 20 22" stroke="#a33246" stroke-width="0.7" fill="none"/>
                    </g>
                </g>
            </defs>
        </svg>

        <!-- Bouquet Container -->
        <div id="bouquetTrigger" class="bouquet-container w-72 h-[380px] flex items-center justify-center relative">
            <div class="absolute -top-1 z-30 bg-white/90 backdrop-blur-md border border-pink-200 text-pink-600 px-3 py-1 rounded-full text-xs font-semibold shadow-md pulse-hint flex items-center gap-1.5">
                <i class="fa-solid fa-hand-pointer text-xs animate-bounce"></i>
                <span>Chạm vào bó hoa để mở thiệp</span>
            </div>

            <div class="absolute inset-0 stem-far-left opacity-90"><svg viewBox="0 0 200 300" class="w-full h-full filter drop-shadow-sm"><use href="#botanicalFlowerBranch" /></svg></div>
            <div class="absolute inset-0 stem-far-right opacity-90"><svg viewBox="0 0 200 300" class="w-full h-full filter drop-shadow-sm scale-x-[-1]"><use href="#botanicalFlowerBranch" /></svg></div>
            <div class="absolute inset-0 stem-left"><svg viewBox="0 0 200 300" class="w-full h-full filter drop-shadow-md"><use href="#botanicalFlowerBranch" /></svg></div>
            <div class="absolute inset-0 stem-right"><svg viewBox="0 0 200 300" class="w-full h-full filter drop-shadow-md scale-x-[-1]"><use href="#botanicalFlowerBranch" /></svg></div>
            <div class="absolute inset-0 stem-center z-10"><svg viewBox="0 0 200 300" class="w-full h-full filter drop-shadow-lg"><use href="#botanicalFlowerBranch" /></svg></div>

            <!-- Bouquet Wrapping Paper -->
            <div class="absolute bottom-2 inset-x-0 h-44 z-20 pointer-events-none flex justify-center items-end">
                <svg viewBox="0 0 200 140" class="w-64 h-44 filter drop-shadow-xl">
                    <path d="M 30 140 L 10 30 L 70 50 L 100 140 Z" fill="#f8e1e7" stroke="#d4a5b0" stroke-width="1"/>
                    <path d="M 170 140 L 190 30 L 130 50 L 100 140 Z" fill="#f3d2dc" stroke="#d4a5b0" stroke-width="1"/>
                    <path d="M 40 140 L 25 15 Q 100 45, 100 140 Z" fill="#fff5f7" stroke="#eabbc7" stroke-width="1"/>
                    <path d="M 160 140 L 175 15 Q 100 45, 100 140 Z" fill="#ffedf1" stroke="#eabbc7" stroke-width="1"/>
                    <path d="M 35 140 L 50 35 L 100 65 L 150 35 L 165 140 Z" fill="#ffffff" stroke="#e2b2bf" stroke-width="1.2"/>
                    <path d="M 50 35 L 100 140" stroke="#f0c2ce" stroke-width="1" stroke-dasharray="3 3"/>
                    <path d="M 150 35 L 100 140" stroke="#f0c2ce" stroke-width="1" stroke-dasharray="3 3"/>
                    <path d="M 92 88 Q 70 115, 60 138 Q 75 135, 95 95 Z" fill="#e63956"/>
                    <path d="M 108 88 Q 130 115, 140 138 Q 125 135, 105 95 Z" fill="#c92a45"/>
                    <path d="M 100 88 C 70 65, 50 85, 92 90 Z" fill="#ee4b66" stroke="#b01e37" stroke-width="0.8"/>
                    <path d="M 100 88 C 130 65, 150 85, 108 90 Z" fill="#e63956" stroke="#b01e37" stroke-width="0.8"/>
                    <rect x="92" y="83" width="16" height="12" rx="4" fill="#b01e37"/>
                </svg>
            </div>
        </div>
        <p class="text-xs text-slate-400 mt-2 text-center">Bó hoa được ghép tầng từ các nhành hoa ly & mẫu đơn thủ công</p>
    </main>

    <!-- Modal Card -->
    <div id="cardModal" class="card-modal hidden-modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
        <div class="glass-card w-full max-w-md rounded-3xl p-6 relative flex flex-col items-center text-center max-h-[85vh] overflow-y-auto">
            <button id="closeModal" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-pink-100 text-slate-500 hover:text-pink-600 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <div class="w-12 h-12 rounded-2xl bg-pink-100 text-pink-500 flex items-center justify-center text-xl mb-3 shadow-inner">
                <i class="fa-solid fa-envelope-open-text"></i>
            </div>

            <h2 class="text-2xl font-cursive font-bold text-slate-800">Gửi Mẹ</h2>
            <div class="w-12 h-0.5 bg-pink-300 my-3 rounded-full"></div>

            <div class="w-full text-left bg-white/70 rounded-2xl p-4 border border-pink-100 my-2 shadow-sm min-h-[160px]">
                <p id="typingText" class="text-sm text-slate-700 leading-relaxed whitespace-pre-line font-medium inline"></p>
                <span id="typingCursor" class="inline-block w-1.5 h-4 bg-pink-500 ml-0.5 animate-pulse align-middle"></span>
            </div>

            <p class="font-cursive text-xl text-pink-600 font-semibold mt-2">Chúc Mẹ luôn rạng rỡ & hạnh phúc! 💕</p>

            <button id="closeBtnAction" class="mt-5 w-full py-3 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-medium rounded-xl shadow-lg shadow-pink-500/25 transition-all">
                Nhận Lời Chúc
            </button>
        </div>
    </div>

    <audio id="bgAudio" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=sweet-love-111678.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Petal Canvas
        const canvas = document.getElementById('petalCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const petals = [];
        for (let i = 0; i < 20; i++) {
            petals.push({
                x: Math.random() * canvas.width,
                y: -20 - Math.random() * 50,
                size: 8 + Math.random() * 8,
                speedY: 1 + Math.random() * 1.5,
                speedX: -0.5 + Math.random(),
                angle: Math.random() * Math.PI * 2,
                spin: -0.02 + Math.random() * 0.04,
                color: ['#fbcfe8', '#f472b6', '#fda4af'][Math.floor(Math.random() * 3)],
                opacity: 0.6
            });
        }
        function animatePetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => {
                p.y += p.speedY; p.x += p.speedX; p.angle += p.spin;
                if (p.y > canvas.height + 20) { p.y = -20; p.x = Math.random() * canvas.width; }
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
                ctx.globalAlpha = p.opacity; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
                ctx.fill(); ctx.restore();
            });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        // Music & Modal Logic
        const audio = document.getElementById('bgAudio');
        const musicToggle = document.getElementById('musicToggle');
        const vinylRecord = document.getElementById('vinylRecord');
        const musicStatus = document.getElementById('musicStatus');
        let isPlaying = false;

        musicToggle.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause(); vinylRecord.classList.remove('spinning'); musicStatus.innerText = "Nhạc Nền"; isPlaying = false;
            } else {
                audio.play().then(() => { vinylRecord.classList.add('spinning'); musicStatus.innerText = "Đang Phát"; isPlaying = true; }).catch(e => console.log(e));
            }
        });

        // TYPING EFFECT LOGIC CHUẨN UNICODE TIẾNG VIỆT
        const rawMessage = `Nhân ngày Phụ nữ Việt Nam 20/10, con xin gửi trọn vẹn những lời chúc tốt đẹp nhất đến mẹ!\n\nChúc Mẹ trẻ mãi không già,\nBao nhiêu hạnh phúc đều là Mẹ mang.\nTiền vào như nước mênh mang,\nCho con "xin ké" tí lộc Mẹ ơi! ✨🌸`;

        const typingTextElem = document.getElementById('typingText');
        const typingCursor = document.getElementById('typingCursor');
        let typeTimer = null;

        function startTyping() {
            if (typeTimer) clearInterval(typeTimer);
            typingTextElem.textContent = "";
            typingCursor.style.display = "inline-block";

            let characters = [];
            if (typeof Intl !== 'undefined' && Intl.Segmenter) {
                const segmenter = new Intl.Segmenter('vi', { granularity: 'grapheme' });
                characters = Array.from(segmenter.segment(rawMessage), s => s.segment);
            } else {
                characters = Array.from(rawMessage);
            }

            let index = 0;
            typeTimer = setInterval(() => {
                if (index < characters.length) {
                    typingTextElem.textContent += characters[index];
                    index++;
                } else {
                    clearInterval(typeTimer);
                    typingCursor.style.display = "none";
                }
            }, 35);
        }

        function stopTyping() {
            if (typeTimer) clearInterval(typeTimer);
            typingTextElem.textContent = "";
        }

        const bouquetTrigger = document.getElementById('bouquetTrigger');
        const cardModal = document.getElementById('cardModal');
        const closeModal = document.getElementById('closeModal');
        const closeBtnAction = document.getElementById('closeBtnAction');

        bouquetTrigger.addEventListener('click', () => {
            cardModal.classList.remove('hidden-modal');
            cardModal.classList.add('visible-modal');
            startTyping();
            if (!isPlaying) musicToggle.click();
        });

        function hideModal() {
            cardModal.classList.remove('visible-modal');
            cardModal.classList.add('hidden-modal');
            stopTyping();
        }

        closeModal.addEventListener('click', hideModal);
        closeBtnAction.addEventListener('click', hideModal);
        cardModal.addEventListener('click', (e) => {
            if (e.target === cardModal) hideModal();
        });
    </script>
</body>
</html>
